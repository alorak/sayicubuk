<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sayı Çubukları — Yıldız Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F9FF;
    --paper-line:#DCE6F8;
    --panel-1:#A98CF0;
    --panel-2:#8E6FE4;
    --panel-lip:#7A57D6;
    --head-1:#7AA8FF;
    --head-2:#5D7CF0;
    --head-edge:#3F55C4;
    --cream:#FBFAFF;
    --ink:#2b2550;
    --gold:#F5A623;
    --gold-2:#FFC94B;
    --good:#59B65C;
    --unit:40px;      /* board unit width per value */
    --rodh:44px;      /* rod height (rows touch) */
    --tray-w:438px;   /* tray panel width (set from rod size in JS) */
    --tray-inset:30px;/* gap from board edges (shows white around tray) */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#6E8AE8;
    overflow:hidden;
    touch-action:none;
  }
  .app{display:flex;flex-direction:column;height:100dvh}

  /* ---- Top bar ---- */
  header{
    display:flex;align-items:center;gap:16px;
    padding:12px 18px;
    background:linear-gradient(180deg,var(--head-1),var(--head-2));
    color:var(--cream);
    border-bottom:3px solid var(--head-edge);
    box-shadow:0 4px 14px rgba(60,70,140,.35);
    z-index:5;
  }
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{
    font-family:"Baloo 2",sans-serif;font-weight:700;
    font-size:clamp(18px,2.6vw,26px);margin:0;letter-spacing:.3px;
    white-space:nowrap;
  }
  .brand small{opacity:.7;font-weight:700;font-size:12px;white-space:nowrap}
  .spacer{flex:1}

  .stars{
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,.22);
    padding:8px 16px 8px 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
  }
  .stars .jar{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .stars .count{
    font-family:"Baloo 2",sans-serif;font-weight:700;font-size:26px;
    color:var(--gold-2);min-width:1.4ch;text-align:center;line-height:1;
  }
  .stars.bump{animation:bump .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

  .btn{
    font-family:"Nunito";font-weight:800;font-size:14px;
    color:var(--cream);background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;
    padding:9px 14px;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
  #settingsBtn{
    width:44px;height:44px;padding:0;border-radius:50%;
    background:#fff;color:#5D7CF0;border:2px solid #E4E9FF;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(40,30,90,.28);
  }
  #settingsBtn:hover{background:#EEF2FF}
  #settingsBtn svg{display:block}

  /* ---- Main ---- */
  main{flex:1;display:flex;min-height:0}

  /* ---- Whiteboard ---- */
  .board-wrap{flex:1;position:relative;padding:14px;min-width:0}
  .board{
    position:relative;height:100%;width:100%;border-radius:16px;overflow:hidden;
    background:
      radial-gradient(circle at 1px 1px,var(--paper-line) 1.4px,transparent 1.6px) 0 0/22px 22px,
      var(--paper);
    box-shadow:inset 0 0 0 3px #fff, inset 0 0 0 6px #d9d0bd, 0 10px 30px rgba(0,0,0,.4);
    touch-action:none;
  }
  .hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:8px;text-align:center;padding:24px;
    color:#b7ad97;pointer-events:none;transition:opacity .4s;
  }
  .hint .big{font-family:"Baloo 2";font-weight:600;font-size:clamp(18px,3vw,26px);color:#a99e86}
  .hint .sm{font-size:14px;font-weight:700;max-width:380px}

  /* ---- Rod (shared) ---- */
  .rod{
    position:absolute;height:var(--rodh);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:"Baloo 2",sans-serif;font-weight:700;
    font-size:calc(var(--rodh) * 0.6);line-height:1;
    color:#fff;user-select:none;cursor:grab;
    background:var(--top,#ccc);
    border:2px solid var(--edge,#000);
    transition:box-shadow .12s,transform .12s;
  }
  .rod .num{pointer-events:none}
  .rod.light{color:#2c2417}
  .rod.dragging{cursor:grabbing;z-index:60;box-shadow:0 6px 16px rgba(40,30,90,.28);transform:scale(1.03)}
  .rod.snap{animation:snap .18s ease}
  @keyframes snap{0%{transform:scale(1.06)}100%{transform:scale(1)}}
  .rod.done{
    box-shadow:0 0 0 3px var(--gold-2),0 0 16px rgba(245,166,35,.55);
  }
  .rod.target-done{
    box-shadow:0 0 0 3px var(--good),0 0 18px rgba(89,182,92,.55);
  }

  /* ---- Tray (floating, collapsible) ---- */
  .tray{
    position:absolute;top:var(--tray-inset);right:var(--tray-inset);width:var(--tray-w);
    max-height:calc(100% - var(--tray-inset) * 2);
    background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
    border:3px solid var(--panel-lip);border-radius:18px;
    box-shadow:0 14px 34px rgba(60,40,120,.4);
    padding:14px;z-index:30;overflow:auto;
    transition:transform .34s cubic-bezier(.4,0,.2,1), opacity .22s ease;
  }
  .tray.hidden{transform:translateX(calc(100% + 28px));opacity:0;pointer-events:none}
  .tray h2{
    font-family:"Baloo 2";color:var(--cream);font-size:15px;font-weight:600;
    margin:0 0 10px;opacity:.9;letter-spacing:.4px;
  }
  .tray-close{
    position:absolute;top:calc(var(--tray-inset) + 20px);
    right:calc(var(--tray-w) + var(--tray-inset) - 6px);
    width:38px;height:52px;border:none;cursor:pointer;
    border-radius:14px 0 0 14px;
    background:linear-gradient(180deg,#B49CF5,#9276E0);
    color:#fff;font-size:22px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
    padding-right:6px;
    box-shadow:-5px 4px 12px rgba(60,40,120,.28);
    z-index:25;
  }
  .tray-close:hover{filter:brightness(1.08)}
  .board-wrap.hide-tray .tray,
  .board-wrap.hide-tray .tray-close,
  .board-wrap.hide-tray .tray-open{display:none !important}
  .tray.hidden ~ .tray-close{opacity:0;pointer-events:none}
  .tray-open{
    position:absolute;top:calc(var(--tray-inset) + 20px);right:0;
    display:none;align-items:center;gap:7px;
    background:linear-gradient(180deg,#B49CF5,#9276E0);color:#fff;
    border:none;cursor:pointer;
    border-radius:14px 0 0 14px;padding:13px 16px;z-index:29;
    font-family:"Baloo 2";font-weight:600;font-size:14px;
    box-shadow:-5px 4px 14px rgba(60,40,120,.4);
  }
  .tray-open:hover{filter:brightness(1.08)}
  .tray-open:focus-visible,.tray-close:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
  .staircase{display:flex;flex-direction:column;gap:10px;align-items:center}
  .pair{display:flex;gap:4px;align-items:center}
  .src{
    height:var(--rodh);border-radius:6px;cursor:grab;position:relative;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:"Baloo 2";font-weight:700;font-size:calc(var(--rodh) * 0.6);line-height:1;color:#fff;
    background:var(--top,#ccc);border:2px solid var(--edge,#000);
    transition:transform .1s;
  }
  .src.light{color:#2c2417}
  .src:hover{transform:translateY(-1px)}
  .src:active{cursor:grabbing}
  .tray .tip{
    color:var(--cream);opacity:.6;font-size:12px;font-weight:700;
    line-height:1.5;padding-top:12px;
  }

  /* floating star particles */
  .spark{position:fixed;pointer-events:none;font-size:20px;z-index:200;will-change:transform,opacity}

  /* ---- Settings modal ---- */
  .modal-overlay{
    position:fixed;inset:0;z-index:300;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(45,37,80,.5);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal-overlay.show{opacity:1;pointer-events:auto}
  .modal-card{
    position:relative;width:min(440px,92vw);
    background:#fff;border-radius:22px;padding:26px 24px 24px;
    box-shadow:0 24px 60px rgba(45,37,80,.4);
    border:3px solid #EAE4FF;
    transform:translateY(12px) scale(.96);transition:transform .24s cubic-bezier(.2,1.3,.4,1);
  }
  .modal-overlay.show .modal-card{transform:none}
  .modal-card h3{
    font-family:"Baloo 2";font-size:24px;font-weight:700;color:var(--ink);
    margin:0 0 4px;
  }
  .modal-card .sub{color:#8983b0;font-weight:700;font-size:13px;margin:0 0 18px}
  .modal-x{
    position:absolute;top:14px;right:14px;width:34px;height:34px;
    border:none;border-radius:50%;cursor:pointer;
    background:#F0ECFF;color:#7A57D6;font-size:16px;font-weight:800;
  }
  .modal-x:hover{background:#E4DCFF}
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border-radius:14px;background:#F5F3FF;margin-bottom:12px;
    font-weight:800;font-size:16px;color:var(--ink);
  }
  .toggle{
    border:none;cursor:pointer;border-radius:999px;
    font-family:"Baloo 2";font-weight:600;font-size:15px;color:#fff;
    padding:8px 20px;background:var(--good);transition:background .15s;
  }
  .toggle[aria-pressed="false"]{background:#C3BEDA}
  .size-group{display:flex;gap:6px;background:#EBE7FA;padding:4px;border-radius:12px}
  .size-opt{
    border:none;cursor:pointer;border-radius:9px;
    font-family:"Baloo 2";font-weight:600;font-size:14px;color:#7A57D6;
    padding:7px 12px;background:transparent;transition:.15s;
  }
  .size-opt.active{background:#8E6FE4;color:#fff;box-shadow:0 2px 5px rgba(90,60,180,.3)}
  .size-opt:hover:not(.active){background:#DDD5F7}
  .modal-btn{
    width:100%;border:none;cursor:pointer;border-radius:16px;
    font-family:"Baloo 2";font-weight:600;font-size:17px;
    padding:15px;margin-top:4px;transition:filter .15s,transform .08s;
  }
  .modal-btn:active{transform:translateY(1px)}
  .modal-btn.danger{background:#FF7A93;color:#fff}
  .modal-btn.danger:hover{filter:brightness(1.05)}
  .modal-actions{display:flex;gap:10px;margin-top:4px}
  .modal-actions .modal-btn{flex:1;width:auto;margin-top:0}
  .modal-btn.ok{background:var(--good);color:#fff}
  .modal-btn.ok:hover{filter:brightness(1.05)}
  .modal-btn:focus-visible,.toggle:focus-visible,.modal-x:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Sayı Çubukları</h1>
    </div>
    <div class="spacer"></div>
    <div class="stars" id="starBox" title="Toplam yıldız">
      <span class="jar">⭐</span>
      <span class="count" id="starCount">0</span>
    </div>
    <button class="btn" id="settingsBtn" title="Ayarlar" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 00-.59.22L2.74 8.87a.5.5 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94 0 .32.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.13.22.39.3.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.2.08.46 0 .59-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
    </button>
  </header>

  <main>
    <div class="board-wrap">
      <div class="board" id="board">
        <div class="hint" id="hint">
          <div class="big">Çubukları buraya sürükle</div>
          <div class="sm">Bir hedef çubuğun (örn. 5) altını tam dolduran parçalarla (3 + 2) doldur → yıldız kazan!</div>
        </div>
      </div>

      <aside class="tray" id="tray">
        <div class="staircase" id="staircase"></div>
      </aside>
      <button class="tray-close" id="closeTray" title="Tepsiyi kapat" aria-label="Tepsiyi kapat">›</button>

      <button class="tray-open" id="openTray" title="Tepsiyi aç" aria-label="Tepsiyi aç">‹ Çubuklar</button>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Ayarlar">
      <button class="modal-x" id="closeModal" aria-label="Kapat">✕</button>
      <h3>Ayarlar</h3>
      <p class="sub">Öğretmen ayarları</p>
      <div class="setting-row">
        <span>🔊 Ses</span>
        <button class="toggle" id="soundToggle" aria-pressed="true">Açık</button>
      </div>
      <div class="setting-row">
        <span>🧰 Çubuk tepsisi</span>
        <button class="toggle" id="trayToggle" aria-pressed="true">Açık</button>
      </div>
      <div class="setting-row">
        <span>📏 Çubuk boyutu</span>
        <div class="size-group">
          <button class="size-opt" data-size="small">Küçük</button>
          <button class="size-opt active" data-size="medium">Orta</button>
          <button class="size-opt" data-size="large">Büyük</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn ok" id="okBtn">Tamam</button>
        <button class="modal-btn danger" id="clearAll">🧹 Tahtayı temizle</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // Cuisenaire-style palette: [top, edge, isLightBackground?]
  const COLORS = {
    1:['#FFFFFF','#D8D0BE',true],
    2:['#E4572E','#B23A1C',false],
    3:['#8BC34A','#5E9E2E',false],
    4:['#8E5BD6','#6E3FB0',false],
    5:['#F2C11B','#C99A0C',true],
    6:['#2FA24E','#1E7B39',false],
    7:['#3A3A3A','#161616',false],
    8:['#8B5A2B','#623C1B',false],
    9:['#2F6FE4','#1E52B8',false],
  };

  let UNIT = 40;     // px per value on board (adjustable)
  let RODH = 44;     // rod height (rows touch)
  const SNAP = 22;   // snap threshold (px)
  const TOL  = 7;    // completion tolerance (px)

  const board = document.getElementById('board');
  const hint = document.getElementById('hint');
  const staircase = document.getElementById('staircase');
  const starCount = document.getElementById('starCount');
  const starBox = document.getElementById('starBox');

  let rods = [];        // {id,value,x,y,w,el,completed}
  let stars = 0;
  let idSeq = 1;
  let soundOn = true;

  /* ---------- audio ---------- */
  let actx=null;
  function beep(freq, dur=0.08, type='sine', vol=0.15){
    if(!soundOn) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.value=vol;
      o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime;
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  function snapSound(){ beep(520,0.06,'triangle',0.12); }
  function winSound(){
    [523,659,784,1046].forEach((f,i)=> setTimeout(()=>beep(f,0.16,'sine',0.16), i*90));
  }

  /* ---------- tray ---------- */
  function makeSrc(v){
    const [top,edge,light]=COLORS[v];
    const s=document.createElement('div');
    s.className='src'+(light?' light':'');
    s.style.setProperty('--top',top);
    s.style.setProperty('--edge',edge);
    s.textContent=v;
    s.dataset.value=v;
    s.addEventListener('pointerdown', e=> spawnFromTray(e, v));
    return s;
  }

  const PAIRS=[[1,9],[2,8],[3,7],[4,6],[5,5]];
  PAIRS.forEach(pair=>{
    const row=document.createElement('div');
    row.className='pair';
    pair.forEach(v=> row.appendChild(makeSrc(v)));
    staircase.appendChild(row);
  });

  // tray rods are shown at the same real size as rods on the board
  const PAIR_GAP=4, TRAY_PAD=14, TRAY_BORDER=3;
  function sizeTray(){
    staircase.querySelectorAll('.src').forEach(s=>{ s.style.width=(s.dataset.value*UNIT)+'px'; });
    const w = 10*UNIT + PAIR_GAP + 2*TRAY_PAD + 2*TRAY_BORDER;
    document.documentElement.style.setProperty('--tray-w', w+'px');
  }
  sizeTray();

  function spawnFromTray(e, value){
    e.preventDefault();
    const r = board.getBoundingClientRect();
    const w = value*UNIT;
    let x = e.clientX - r.left - w/2;
    let y = e.clientY - r.top - RODH/2;
    const rod = addRod(value, x, y);
    beginDrag(rod, e, true);
  }

  /* ---------- rods ---------- */
  function addRod(value, x, y){
    const [top,edge,light]=COLORS[value];
    const el=document.createElement('div');
    el.className='rod'+(light?' light':'');
    el.style.setProperty('--top',top);
    el.style.setProperty('--edge',edge);
    el.style.width=(value*UNIT)+'px';
    el.innerHTML='<span class="num">'+value+'</span>';
    const rod={id:idSeq++, value, x, y, w:value*UNIT, el, completed:false};
    place(rod);
    board.appendChild(el);
    rods.push(rod);
    el.addEventListener('pointerdown', e=>{ if(e.target===el||e.target.parentNode===el) beginDrag(rod,e,false); });
    el.addEventListener('dblclick', ()=> removeRod(rod));
    hint.style.opacity='0';
    return rod;
  }

  function place(rod){
    rod.el.style.left=rod.x+'px';
    rod.el.style.top =rod.y+'px';
  }

  function removeRod(rod){
    rod.el.remove();
    rods = rods.filter(r=>r!==rod);
    if(rods.length===0) hint.style.opacity='1';
  }

  /* ---------- dragging ---------- */
  let drag=null;
  function beginDrag(rod, e, fresh){
    const r=board.getBoundingClientRect();
    drag={rod, offX:(e.clientX-r.left)-rod.x, offY:(e.clientY-r.top)-rod.y};
    if(fresh){ drag.offX=rod.w/2; drag.offY=RODH/2; }
    rod.el.classList.add('dragging');
    // bring to front
    board.appendChild(rod.el);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once:true});
  }

  function onMove(e){
    if(!drag) return;
    const r=board.getBoundingClientRect();
    let x=(e.clientX-r.left)-drag.offX;
    let y=(e.clientY-r.top)-drag.offY;
    drag.rod.x=x; drag.rod.y=y;
    place(drag.rod);
  }

  function onUp(e){
    if(!drag) return;
    window.removeEventListener('pointermove', onMove);
    const rod=drag.rod;
    rod.el.classList.remove('dragging');

    // dropped over tray (only when it's open) -> delete
    const trayEl=document.getElementById('tray');
    const tray=trayEl.getBoundingClientRect();
    if(!trayEl.classList.contains('hidden') &&
       e.clientX>=tray.left && e.clientX<=tray.right && e.clientY>=tray.top && e.clientY<=tray.bottom){
      removeRod(rod); drag=null; return;
    }

    snapRod(rod);
    // clamp inside board
    const bw=board.clientWidth, bh=board.clientHeight;
    rod.x=Math.max(0,Math.min(rod.x, bw-rod.w));
    rod.y=Math.max(0,Math.min(rod.y, bh-RODH));
    place(rod);
    checkCompletions();
    drag=null;
  }

  function snapRod(rod){
    // collect candidate edges from other rods
    let bestX=null, bestXd=SNAP+1;
    let bestY=null, bestYd=SNAP+1;
    for(const o of rods){
      if(o===rod) continue;
      // X: align left/right edges (left-align or butt-join)
      for(const [target,val] of [[o.x, o.x],[o.x+o.w, o.x+o.w]]){
        let d=Math.abs(rod.x - target); if(d<bestXd){bestXd=d;bestX=target;}          // snap left edge
        d=Math.abs((rod.x+rod.w) - target); if(d<bestXd){bestXd=d;bestX=target-rod.w;} // snap right edge
      }
      // Y: stack on top/below (touching rows) or same row
      for(const target of [o.y, o.y+RODH]){
        let d=Math.abs(rod.y - target); if(d<bestYd){bestYd=d;bestY=target;}          // snap top
        d=Math.abs((rod.y+RODH) - target); if(d<bestYd){bestYd=d;bestY=target-RODH;}  // snap bottom
      }
    }
    let snapped=false;
    if(bestX!==null){ rod.x=Math.round(bestX); snapped=true; }
    else { rod.x=Math.round(rod.x/UNIT)*UNIT; }        // fall back to unit grid
    if(bestY!==null){ rod.y=Math.round(bestY); snapped=true; }
    else { rod.y=Math.round(rod.y/RODH)*RODH; }        // fall back to row grid
    if(snapped){
      snapSound();
      rod.el.classList.remove('snap'); void rod.el.offsetWidth; rod.el.classList.add('snap');
    }
  }

  /* ---------- completion detection ---------- */
  function checkCompletions(){
    for(const T of rods){
      if(T.completed) continue;
      const rowY = T.y + RODH;

      // pieces sitting in the row directly below T, within T's horizontal span
      const below = rods.filter(r =>
        r!==T &&
        Math.abs(r.y - rowY) < 14 &&
        r.x > T.x - 12 && (r.x + r.w) < T.x + T.w + 12
      ).sort((a,b)=>a.x-b.x);

      if(below.length < 2) continue;

      // values must add up to the target
      const sum = below.reduce((s,p)=>s+p.value,0);
      if(sum !== T.value) continue;

      // and they must span the target from left edge to right edge
      const last = below[below.length-1];
      const leftOk  = Math.abs(below[0].x - T.x) < UNIT*0.6;
      const rightOk = Math.abs((last.x + last.w) - (T.x + T.w)) < UNIT*0.6;
      if(!leftOk || !rightOk) continue;

      // success — tidy pieces into a perfect edge-to-edge row, then reward
      let cx = T.x;
      for(const p of below){ p.x = cx; p.y = rowY; cx += p.w; place(p); }
      award(T, below);
    }
  }

  function award(T, below){
    T.completed=true;
    T.el.classList.add('target-done');
    below.forEach(p=>p.el.classList.add('done'));
    addStars(T.value);
    winSound();
    burst(T);
  }

  function addStars(n){
    stars+=n;
    starCount.textContent=stars;
    starBox.classList.remove('bump'); void starBox.offsetWidth; starBox.classList.add('bump');
  }

  /* ---------- star burst ---------- */
  function burst(T){
    const r=T.el.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const jar=starBox.getBoundingClientRect();
    const jx=jar.left+22, jy=jar.top+jar.height/2;
    const N=Math.min(T.value+3, 12);
    for(let i=0;i<N;i++){
      const s=document.createElement('div');
      s.className='spark'; s.textContent='⭐';
      s.style.left=cx+'px'; s.style.top=cy+'px';
      document.body.appendChild(s);
      const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
      const px=Math.cos(ang)*dist, py=Math.sin(ang)*dist-30;
      // phase 1: pop out, phase 2: fly to jar
      s.animate([
        {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
        {transform:`translate(calc(-50% + ${px}px),calc(-50% + ${py}px)) scale(1.2)`,opacity:1,offset:.45},
        {transform:`translate(${jx-cx}px,${jy-cy}px) scale(.3)`,opacity:0}
      ],{duration:900+Math.random()*250,easing:'cubic-bezier(.3,.7,.3,1)'})
      .onfinish=()=>s.remove();
    }
  }

  /* ---------- controls ---------- */
  function clearBoard(){
    rods.slice().forEach(removeRod);
    hint.style.opacity='1';
  }

  // ---- settings modal ----
  const modal=document.getElementById('modal');
  const settingsBtn=document.getElementById('settingsBtn');
  const closeModal=document.getElementById('closeModal');
  const soundToggle=document.getElementById('soundToggle');
  const clearAll=document.getElementById('clearAll');

  function openSettings(){ modal.classList.add('show'); }
  function hideSettings(){ modal.classList.remove('show'); }

  settingsBtn.addEventListener('click', openSettings);
  closeModal.addEventListener('click', hideSettings);
  modal.addEventListener('click', e=>{ if(e.target===modal) hideSettings(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') hideSettings(); });

  soundToggle.addEventListener('click', ()=>{
    soundOn=!soundOn;
    soundToggle.textContent = soundOn ? 'Açık' : 'Kapalı';
    soundToggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if(soundOn) beep(660,0.06,'sine',0.1);
  });

  clearAll.addEventListener('click', ()=>{
    clearBoard();
    hideSettings();
  });
  document.getElementById('okBtn').addEventListener('click', hideSettings);

  // ---- rod size ----
  const SIZES={ small:32, medium:40, large:52 };
  let currentSize='medium';
  const sizeBtns=[...document.querySelectorAll('.size-opt')];

  function applySize(nu){
    const rx = nu/UNIT;
    const nh = Math.round(nu*1.1);
    const ry = nh/RODH;
    UNIT = nu; RODH = nh;
    document.documentElement.style.setProperty('--rodh', RODH+'px');
    for(const r of rods){
      r.x = Math.round(r.x*rx);
      r.y = Math.round(r.y*ry);
      r.w = r.value*UNIT;
      r.el.style.width = r.w+'px';
      place(r);
    }
    sizeTray();
  }
  function setSize(key){
    currentSize=key;
    applySize(SIZES[key]);
    sizeBtns.forEach(b=> b.classList.toggle('active', b.dataset.size===key));
  }
  sizeBtns.forEach(b=> b.addEventListener('click', ()=>{ setSize(b.dataset.size); beep(600,0.05,'sine',0.1); }));

  // ---- show / hide the whole tray (live) ----
  const boardWrap=document.querySelector('.board-wrap');
  const trayToggle=document.getElementById('trayToggle');
  trayToggle.addEventListener('click', ()=>{
    const show = boardWrap.classList.contains('hide-tray'); // becoming shown
    boardWrap.classList.toggle('hide-tray', !show);
    trayToggle.textContent = show ? 'Açık' : 'Kapalı';
    trayToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    beep(show?620:440,0.05,'sine',0.1);
  });

  // ---- tray open / close ----
  const trayEl=document.getElementById('tray');
  const openBtn=document.getElementById('openTray');
  const closeBtn=document.getElementById('closeTray');
  function setTray(open){
    trayEl.classList.toggle('hidden', !open);
    openBtn.style.display = open ? 'none' : 'flex';
    beep(open?620:440,0.06,'sine',0.1);
  }
  closeBtn.addEventListener('click', ()=> setTray(false));
  openBtn.addEventListener('click', ()=> setTray(true));

  // prevent scroll/gesture interference on the board
  board.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
})();
</script>
</body>
</html>
